<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumine - Whiteboard Organizacional</title>

    <!-- Excalidraw styles -->
    <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />

    <!-- Import maps to deduplicate React -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; overflow: hidden; }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: #6b7280;
            gap: 16px;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #764ba2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .header-bar {
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
        }

        .header-bar h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header-bar .back-link {
            color: white;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        .header-bar .back-link:hover {
            opacity: 1;
        }

        .excalidraw-wrapper {
            height: calc(100% - 48px);
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            <span>Carregando Excalidraw...</span>
        </div>
    </div>

    <script type="module">
        import React from "https://esm.sh/react@18.3.1";
        import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?external=react";
        import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?external=react,react-dom,react/jsx-runtime";

        const STORAGE_KEY = "alumine-excalidraw-data";

        function loadSavedData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.warn("Erro ao carregar dados salvos:", e);
            }
            return null;
        }

        function saveData(elements, appState) {
            try {
                const data = {
                    elements: elements.filter(el => !el.isDeleted),
                    appState: {
                        viewBackgroundColor: appState.viewBackgroundColor,
                    },
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn("Erro ao salvar dados:", e);
            }
        }

        const saved = loadSavedData();

        const defaultData = {
            elements: [],
            appState: {
                viewBackgroundColor: "#f8f9fa",
            },
        };

        const initialData = saved || defaultData;

        const h = React.createElement;

        function App() {
            return h("div", { style: { height: "100%", width: "100%", display: "flex", flexDirection: "column" } },
                h("div", { className: "header-bar" },
                    h("h1", null, "Alumine - Estrutura Organizacional"),
                    h("a", { className: "back-link", href: "index.html" }, "Voltar")
                ),
                h("div", { className: "excalidraw-wrapper" },
                    h(Excalidraw, {
                        initialData: initialData,
                        langCode: "pt-BR",
                        theme: "light",
                        onChange: saveData,
                    })
                )
            );
        }

        const root = createRoot(document.getElementById("root"));
        root.render(h(App));
    </script>
</body>
</html>
