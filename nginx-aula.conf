server {
    listen 80;
    server_name _;

    # A pasta aula/ vira a raiz do site: os caminhos relativos da página
    # (img/logo.png etc.) resolvem direto, sem prefixo /aula.
    root /usr/share/nginx/html;
    index index.html;

    # A navegação entre slides usa o hash (#s3), que não chega ao servidor;
    # qualquer rota desconhecida volta para a aula.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
