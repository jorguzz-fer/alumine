<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumine - Whiteboard Organizacional</title>

    <!-- Excalidraw styles -->
    <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />

    <!-- Import maps to deduplicate React -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; width: 100%; overflow: hidden; }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: 'Inter', sans-serif;
            color: #6b7280;
            gap: 16px;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #764ba2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .header-bar {
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            color: white;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
        }

        .header-bar h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .excalidraw-wrapper {
            height: calc(100% - 48px);
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            <span>Carregando Excalidraw...</span>
        </div>
    </div>

    <script type="module">
        import React from "react";
        import { createRoot } from "react-dom/client";
        import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom";

        const STORAGE_KEY = "alumine-excalidraw-data";

        function loadSavedData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.warn("Erro ao carregar dados salvos:", e);
            }
            return null;
        }

        function saveData(elements, appState) {
            try {
                const data = {
                    elements: elements.filter(el => !el.isDeleted),
                    appState: {
                        viewBackgroundColor: appState.viewBackgroundColor,
                    },
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn("Erro ao salvar dados:", e);
            }
        }

        const saved = loadSavedData();

        const defaultData = {
            elements: [
                // === ALUMINE (Holding - topo) ===
                {
                    type: "rectangle", id: "alumine-box",
                    x: 350, y: 80, width: 240, height: 80, angle: 0,
                    strokeColor: "#1e1e1e", backgroundColor: "#3498db",
                    fillStyle: "solid", strokeWidth: 2, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    roundness: { type: 3 },
                    seed: 100001, groupIds: [],
                    version: 1, versionNonce: 100001, isDeleted: false,
                    boundElements: [
                        { id: "text-alumine", type: "text" },
                        { id: "arrow-to-saude", type: "arrow" },
                        { id: "arrow-to-business", type: "arrow" }
                    ],
                },
                {
                    type: "text", id: "text-alumine",
                    x: 360, y: 90, width: 220, height: 60, angle: 0,
                    strokeColor: "#ffffff", backgroundColor: "transparent",
                    fillStyle: "solid", strokeWidth: 1, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    fontSize: 20, fontFamily: 1,
                    text: "ALUMINE\nEducação", originalText: "ALUMINE\nEducação",
                    textAlign: "center", verticalAlign: "middle",
                    containerId: "alumine-box", autoResize: true,
                    seed: 100002, groupIds: [],
                    version: 1, versionNonce: 100002, isDeleted: false,
                },

                // === ALUMINE SAÚDE (esquerda) ===
                {
                    type: "rectangle", id: "saude-box",
                    x: 120, y: 280, width: 240, height: 80, angle: 0,
                    strokeColor: "#1e1e1e", backgroundColor: "#27ae60",
                    fillStyle: "solid", strokeWidth: 2, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    roundness: { type: 3 },
                    seed: 200001, groupIds: [],
                    version: 1, versionNonce: 200001, isDeleted: false,
                    boundElements: [
                        { id: "text-saude", type: "text" },
                        { id: "arrow-to-saude", type: "arrow" }
                    ],
                },
                {
                    type: "text", id: "text-saude",
                    x: 130, y: 290, width: 220, height: 60, angle: 0,
                    strokeColor: "#ffffff", backgroundColor: "transparent",
                    fillStyle: "solid", strokeWidth: 1, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    fontSize: 18, fontFamily: 1,
                    text: "Alumine Saúde\nHealth Education", originalText: "Alumine Saúde\nHealth Education",
                    textAlign: "center", verticalAlign: "middle",
                    containerId: "saude-box", autoResize: true,
                    seed: 200002, groupIds: [],
                    version: 1, versionNonce: 200002, isDeleted: false,
                },

                // === ALUMINE BUSINESS SCHOOL (direita) ===
                {
                    type: "rectangle", id: "business-box",
                    x: 560, y: 280, width: 260, height: 80, angle: 0,
                    strokeColor: "#1e1e1e", backgroundColor: "#764ba2",
                    fillStyle: "solid", strokeWidth: 2, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    roundness: { type: 3 },
                    seed: 300001, groupIds: [],
                    version: 1, versionNonce: 300001, isDeleted: false,
                    boundElements: [
                        { id: "text-business", type: "text" },
                        { id: "arrow-to-business", type: "arrow" }
                    ],
                },
                {
                    type: "text", id: "text-business",
                    x: 570, y: 290, width: 240, height: 60, angle: 0,
                    strokeColor: "#ffffff", backgroundColor: "transparent",
                    fillStyle: "solid", strokeWidth: 1, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    fontSize: 18, fontFamily: 1,
                    text: "Alumine Business\nSchool", originalText: "Alumine Business\nSchool",
                    textAlign: "center", verticalAlign: "middle",
                    containerId: "business-box", autoResize: true,
                    seed: 300002, groupIds: [],
                    version: 1, versionNonce: 300002, isDeleted: false,
                },

                // === SETA: Alumine -> Saúde ===
                {
                    type: "arrow", id: "arrow-to-saude",
                    x: 400, y: 160, width: 160, height: 120, angle: 0,
                    strokeColor: "#1e1e1e", backgroundColor: "transparent",
                    fillStyle: "solid", strokeWidth: 2, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    points: [[0, 0], [-160, 120]],
                    startBinding: { elementId: "alumine-box", focus: -0.3, gap: 8 },
                    endBinding: { elementId: "saude-box", focus: 0.3, gap: 8 },
                    startArrowhead: null, endArrowhead: "arrow",
                    seed: 400001, groupIds: [],
                    version: 1, versionNonce: 400001, isDeleted: false,
                },

                // === SETA: Alumine -> Business School ===
                {
                    type: "arrow", id: "arrow-to-business",
                    x: 540, y: 160, width: 150, height: 120, angle: 0,
                    strokeColor: "#1e1e1e", backgroundColor: "transparent",
                    fillStyle: "solid", strokeWidth: 2, strokeStyle: "solid",
                    roughness: 0, opacity: 100,
                    points: [[0, 0], [150, 120]],
                    startBinding: { elementId: "alumine-box", focus: 0.3, gap: 8 },
                    endBinding: { elementId: "business-box", focus: -0.3, gap: 8 },
                    startArrowhead: null, endArrowhead: "arrow",
                    seed: 500001, groupIds: [],
                    version: 1, versionNonce: 500001, isDeleted: false,
                },
            ],
            appState: {
                viewBackgroundColor: "#f8f9fa",
            },
        };

        const initialData = saved || defaultData;

        const h = React.createElement;

        function App() {
            return h("div", { style: { height: "100%", width: "100%", display: "flex", flexDirection: "column" } },
                h("div", { className: "header-bar" },
                    h("h1", null, "Alumine - Estrutura Organizacional")
                ),
                h("div", { className: "excalidraw-wrapper" },
                    h(Excalidraw, {
                        initialData: initialData,
                        langCode: "pt-BR",
                        theme: "light",
                        onChange: saveData,
                    })
                )
            );
        }

        const root = createRoot(document.getElementById("root"));
        root.render(h(App));
    </script>
</body>
</html>
