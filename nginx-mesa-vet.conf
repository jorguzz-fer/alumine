server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Página única: qualquer rota desconhecida volta para a LP, preservando
    # a query string (UTMs) que o formulário lê no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A página embute as imagens em base64 (~590 KB); gzip reduz bastante.
    gzip on;
    gzip_min_length 1024;

    # Sem cache longo no HTML: troca de copy precisa aparecer no próximo acesso.
    add_header Cache-Control "no-cache";
}
