server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Serve the tax-reform landing page as the site root
    index reforma-tributaria.html;

    # Painel interno de acompanhamento da campanha. Precisa vir antes do
    # catch-all: o try_files abaixo devolve a landing para qualquer rota
    # desconhecida, entao sem esta regra /painel abriria a LP.
    location ~ ^/painel/?$ {
        try_files /painel.html =404;
    }

    # API do checkout servida sob o proprio dominio.
    #
    # O POST do checkout para pay.alumine.com.br e cross-origin com
    # Content-Type: application/json, o que obriga um preflight OPTIONS. No
    # Safari do iPhone esse preflight falha e o fetch morre com "Load failed" —
    # sem virar resposta HTTP, entao o comprador so ve uma mensagem opaca.
    #
    # Encaminhar por aqui torna a chamada mesma-origem: sem preflight, sem CORS
    # e sem depender do edge de um segundo dominio. Vai para o endereco publico
    # em vez do container interno de proposito — nao exige saber o nome do
    # servico no Coolify, que e o tipo de suposicao que devolve 502.
    location /api/ {
        resolver 127.0.0.11 1.1.1.1 valid=30s ipv6=off;
        set $checkout_api https://pay.alumine.com.br;

        # O proxy_pass precisa da variavel para o nginx aceitar subir sem
        # resolver o nome no boot. Mas com variavel ele NAO troca o prefixo do
        # location sozinho: sem este rewrite, /api/checkout chega no destino
        # como "/" e o pagamento nunca e criado.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $checkout_api;

        proxy_ssl_server_name on;
        proxy_ssl_name pay.alumine.com.br;
        proxy_set_header Host pay.alumine.com.br;

        # A API usa o IP do comprador como sinal de correspondencia da CAPI.
        # Sem repassar, todo evento chega com o IP do proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /reforma-tributaria.html;
    }
}
